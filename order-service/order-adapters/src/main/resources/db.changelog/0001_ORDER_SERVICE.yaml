databaseChangeLog:
  - changeSet:
      id: 001
      author: Crasheroo
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: total_amount
                  type: DOUBLE

  - changeSet:
      id: 002
      author: Crasheroo
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(255)
              - column:
                  name: quantity
                  type: INTEGER
              - column:
                  name: price
                  type: DOUBLE
              - column:
                  name: order_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            constraintName: fk_order_items_orders
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 003
      author: Crasheroo
      changes:
        - createTable:
            tableName: invoices
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
              - column:
                  name: amount
                  type: DOUBLE
              - column:
                  name: issued_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: invoices
            baseColumnNames: order_id
            constraintName: fk_invoices_orders
            referencedTableName: orders
            referencedColumnNames: id
