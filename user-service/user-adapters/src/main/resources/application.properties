spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
server.port=8084

spring.profiles.active=local

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
app.security.pepper=${APP_SECURITY_PEPPER}

# Keycloak Adapter (OIDC)
keycloak.realm=admin
keycloak.auth-server-url=http://keycloak:8080/
keycloak.resource=user-service
keycloak.credentials.secret=secret
keycloak.bearer-only=true

# Keycloak Admin Client
keycloak.admin.server-url=http://localhost:8080/
keycloak.admin.realm=admin
keycloak.admin.client-id=admin-cli
keycloak.admin.password=admin
keycloak.admin.username=admin

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/admin
logging.level.org.springframework.security=DEBUG